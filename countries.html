/* Dedicated Page Container */
    .page-wrapper {
      max-width: 1100px;
      margin: 0 auto;
      padding: 24px 20px 60px;
      width: 100%;
    }

    .top-nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      transition: all 0.2s;
    }

    .back-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.08);
      transform: translateX(-2px);
    }

    body.light-theme .back-btn {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .countries-header {
      margin-bottom: 20px;
    }

    .countries-header h1 {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--text-main);
    }

    .countries-header p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Live Search & Continent Filters Bar */
    .controls-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      align-items: center;
      justify-content: space-between;
    }

    .table-search-box {
      position: relative;
      flex: 1;
      min-width: 260px;
      max-width: 400px;
    }

    .table-search-input {
      width: 100%;
      height: 40px;
      padding: 0 16px 0 38px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.85rem;
      outline: none;
    }

    body.light-theme .table-search-input {
      background: #ffffff;
      border-color: #cbd5e1;
    }

    .table-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 16px;
      height: 16px;
      color: var(--text-muted);
    }

    /* Full-width Responsive Table */
    .table-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .countries-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.82rem;
    }

    .countries-table th, .countries-table td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    body.light-theme .countries-table td {
      border-bottom-color: #e2e8f0;
    }

    .countries-table th {
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    body.light-theme .countries-table th {
      background: #f1f5f9;
      color: #475569;
    }

    .countries-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.02);
    }

    body.light-theme .countries-table tbody tr:hover {
      background: #f8fafc;
    }

    .currency-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      background: rgba(99, 102, 241, 0.15);
      color: #93c5fd;
      border: 1px solid rgba(99, 102, 241, 0.25);
    }

    body.light-theme .currency-pill {
      background: #eff6ff;
      color: #1d4ed8;
      border-color: #bfdbfe;
    }
    /* =======================================================
   RESPONSIVE COMPACT TABLE STYLES
   ======================================================= */

.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
  /* Ensures smooth horizontal touch scrolling if needed */
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
}

.countries-table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 0.82rem;
  white-space: nowrap; /* Prevents awkward multi-line breakage */
}

.countries-table th, 
.countries-table td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border-color);
}

@media (max-width: 768px) {

    width: 100%;
    padding-bottom: 4px;
  }

  .filter-pills .pill {
    padding: 4px 10px;
    font-size: 0.7rem;

  /* Compact Table Layout for Mobile */
  .countries-table {
    font-size: 0.72rem; /* Smaller, crisp legible font */
  }

  .countries-table th, 
  .countries-table td {
    padding: 6px 8px !important; /* Minimal padding */

  .countries-table th {
    font-size: 0.65rem;
  }

  .currency-pill {
    font-size: 0.65rem;
    padding: 1px 5px;
  }
}

/* Extra Small Phones (< 480px) */
@media (max-width: 480px) {
  .page-wrapper {
    padding: 8px 6px 30px !important;
  }

  .countries-table {
    font-size: 0.68rem; /* Ultra compact */

  .countries-table th, 
  .countries-table td {

  }

  /* Hide serial number & continent on small screens so Country, Capital, and Currency fit 100% visible without horizontal scrolling */
  .col-num, 
  .col-continent {
    display: none !important;
  }
}

    let currentContinent = 'All';
    let searchQuery = '';

    function renderTable() {


      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';

      const filtered = COUNTRIES_DATA.filter(item => {
        const matchesContinent = (currentContinent === 'All' || item.continent === currentContinent);
        const query = searchQuery.toLowerCase();
        const matchesQuery = item.name.toLowerCase().includes(query) ||
                             item.capital.toLowerCase().includes(query) ||
                             item.currency.toLowerCase().includes(query);
        return matchesContinent && matchesQuery;
      });

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: var(--text-muted); padding: 24px;">No matching countries found.</td></tr>`;
        return;
      }

     filtered.forEach((c, idx) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="col-num" style="color: var(--text-dim);">${idx + 1}</td>
          <td><strong>${c.name}</strong></td>
          <td>${c.capital}</td>
          <td><span class="currency-pill">${c.currency}</span></td>
          <td class="col-continent" style="color: var(--text-muted);">${c.continent}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Initial render
    renderTable();
    lucide.createIcons();

    // Live search listener
    document.getElementById('countrySearch').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderTable();
    });

    // Filter pills listener
    document.querySelectorAll('.filter-pills .pill').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter-pills .pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentContinent = btn.getAttribute('data-continent');
        renderTable();
      });
    });

    // Theme Sync & Toggle
    const savedTheme = localStorage.getItem('app_theme') || 'light';
    document.body.classList.toggle('light-theme', savedTheme === 'light');
    document.getElementById('themeIcon').setAttribute('data-lucide', savedTheme === 'light' ? 'moon' : 'sun');
    lucide.createIcons();

    document.getElementById('themeToggleBtn').addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('app_theme', isLight ? 'light' : 'dark');
      document.getElementById('themeIcon').setAttribute('data-lucide', isLight ? 'moon' : 'sun');
      lucide.createIcons();
    });
  </script>
