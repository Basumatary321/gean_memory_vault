  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Vault - Advanced PDF & Notes Library</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Overlay for Mobile -->
    <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleMobileSidebar()"></div>

    <!-- Sidebar Navigation -->
    <aside id="appSidebar">
        <div class="sidebar-header">
            <h2>📚 StudyVault</h2>
            <button class="close-sidebar-btn" onclick="toggleMobileSidebar()">
                <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>
        <ul class="sidebar-menu" id="sidebarMenu">
            <!-- Dynamically populated categories -->
        </ul>
    </aside>

    <!-- Main Content -->
    <main>
        <!-- Top Bar with Breadcrumbs & Controls -->
        <div class="top-bar">
            

            <div class="header-action-row">
                <div class="view-title-area">
                    <!-- 3-Line Hamburger Menu Button -->
                    <button class="hamburger-btn" onclick="toggleMobileSidebar()" aria-label="Toggle Menu">
                        <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"></path>
                        </svg>
                    </button>
                    <h1 id="activeSubjectTitle">📐 Mathematics & Aptitude</h1>
                </div>

                <div class="controls-area">
                    <div class="search-box">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                        </svg>
                        <input type="text" id="searchInput" placeholder="Search notes, formulas, topics..." oninput="filterNotes()">
                    </div>

                    <div class="view-toggle-group">
                        <button class="view-btn" id="listBtn" onclick="switchView('list')">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg>
                            List
                        </button>
                        <button class="view-btn active" id="gridBtn" onclick="switchView('grid')">
                            <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
                            Grid
                        </button>
                    </div>
                    
                </div>
                <div class="breadcrumb" id="breadcrumbNav">
                <span>Home</span> &gt; <span class="current">Mathematics</span>
            </div>
            </div>

            <!-- Sub-topic Pill Navigation -->
            <div class="subtopic-tabs" id="subtopicTabs">
                <!-- Dynamically populated subtopics -->
            </div>
        </div>

        <!-- Dynamic Content Display Area -->
        <div id="contentDisplayArea">
            <!-- Grid or List view renders here -->
        </div>
    </main>

    <script>
        const vaultData = {
            "mathematics": {
                name: "Mathematics & Aptitude",
                icon: "📐",
                topics: {
                    "all": "All Mathematics Notes",
                    "arithmetic": "Arithmetic",
                    "algebra": "Algebra & Number System",
                    "geometry": "Geometry & Mensuration",
                   
                },
                notes: [
                    {
                        id: "m-01",
                        topic: "arithmetic",
                        title: "LCM & HCF Complete Shortcuts",
                        description: "Prime factorization methods, shortcut tricks for competitive exams, and previous year exam questions solved.",
                        format: "PDF",
                        date: "Feb 15, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1635070041078-e363dbe005cb?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    },
                    {
                        id: "m-02",
                        topic: "arithmetic",
                        title: "Time, Speed & Distance Mastery",
                        description: "Relative speed formulas, train problems, circular tracks, and boat & stream concepts with step-by-step solutions.",
                        format: "PDF",
                        date: "Feb 18, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1509228468518-180dd4864904?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    },
                    {
                        id: "m-03",
                        topic: "arithmetic",
                        title: "Percentage, Profit & Loss",
                        description: "Successive percentage change formulas, discount shortcuts, and dishonest dealer problem techniques.",
                        format: "Docs",
                        date: "Jan 10, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "reasoning": {
                name: "Logical Reasoning",
                icon: "🧠",
                topics: {
                    "all": "All Reasoning Notes",
                    "verbal": "Verbal Reasoning",
                    "non-verbal": "Non-Verbal & Analytical"
                },
                notes: [
                    {
                        id: "r-01",
                        topic: "verbal",
                        title: "Blood Relations & Family Trees",
                        description: "Decoding coded relations, generation mapping techniques, and tricky exam problem sets.",
                        format: "PDF",
                        date: "Feb 10, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    },
                    {
                        id: "r-02",
                        topic: "verbal",
                        title: "Syllogism & Venn Diagrams",
                        description: "Possibility cases, 'Either-Or' conditions, and 100/50 method mastery guide.",
                        format: "Docs",
                        date: "Jan 14, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1434030216411-0b793f4b4173?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "geography": {
                name: "Geography (India & Assam)",
                icon: "🌍",
                topics: {
                    "all": "All Geography Notes",
                    "india-geo": "Indian Geography",
                    "assam-geo": "Assam & Northeast Geo"
                },
                notes: [
                    {
                        id: "g-01",
                        topic: "india-geo",
                        title: "Indian River Systems & Tributaries",
                        description: "Himalayan and Peninsular rivers, origin points, multipurpose dams, and drainage basins.",
                        format: "PDF",
                        date: "Feb 12, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    },
                    {
                        id: "g-02",
                        topic: "assam-geo",
                        title: "Assam National Parks & Sanctuaries",
                        description: "Kaziranga, Manas, Nameri, Orang, Dehing Patkai, and biodiversity corridors detailed handbook.",
                        format: "PDF",
                        date: "Feb 20, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1534567153574-2b12153a87f0?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "history": {
                name: "History (Assam & Modern India)",
                icon: "🏛️",
                topics: {
                    "all": "All History Notes",
                    "assam-hist": "Assam History",
                    "modern-india": "Modern Indian History"
                },
                notes: [
                    {
                        id: "h-01",
                        topic: "assam-hist",
                        title: "Ahom Dynasty & Administration",
                        description: "Surgadevu rule, Paik system, Saraighat battle, and Burmese invasions of Assam.",
                        format: "Docs",
                        date: "Feb 05, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1599839575945-a9e5af0c3fa5?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "science": {
                name: "General Science",
                icon: "🔬",
                topics: {
                    "all": "All Science Notes",
                    "physics": "Physics",
                    "biology": "Biology"
                },
                notes: [
                    {
                        id: "s-01",
                        topic: "physics",
                        title: "Mechanics, Motion & Laws of Force",
                        description: "Newton's laws, work, energy, power, gravitation, and important numerical formulas.",
                        format: "PDF",
                        date: "Feb 08, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1507668077129-56e32842fceb?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "english": {
                name: "English Grammar & Vocabulary",
                icon: "📖",
                topics: {
                    "all": "All English Notes",
                    "grammar": "Grammar Rules",
                    "vocab": "Vocabulary & Idioms"
                },
                notes: [
                    {
                        id: "e-01",
                        topic: "grammar",
                        title: "Active-Passive & Direct-Indirect Rules",
                        description: "Comprehensive sentence transformation rules with exceptional cases and exercise sets.",
                        format: "Docs",
                        date: "Feb 14, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            },
            "Pyq": {
                name: "Previous Year Question",
                icon: "📖",
                topics: {
                    "all": "All Year PYQ",
                    "BTCFT": "Forester",
                    "BTCFG": "Forest Guard"
                },
                notes: [
                    {
                        id: "f-01",
                        topic: "BTCFT",
                        title: "Active-Passive & Direct-Indirect Rules",
                        description: "Comprehensive sentence transformation rules with exceptional cases and exercise sets.",
                        format: "Docs",
                        date: "Feb 14, 2026",
                        thumbnail: "https://images.unsplash.com/photo-1456513080510-7bf3a84b82f8?w=400&auto=format&fit=crop&q=60",
                        fileUrl: "https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
                    }
                ]
            }

        };

        let currentSubjectKey = "mathematics";
        let currentSubtopic = "all";
        let currentView = "grid";

        function initApp() {
            renderSidebar();
            loadSubject(currentSubjectKey);
            renderNotesContent(); // <--- Added this so content renders immediately on page load / refresh
        }

        function toggleMobileSidebar() {
            const sidebar = document.getElementById("appSidebar");
            const overlay = document.getElementById("sidebarOverlay");
            sidebar.classList.toggle("mobile-open");
            overlay.classList.toggle("active");
        }

        function renderSidebar() {
            const sidebarMenu = document.getElementById("sidebarMenu");
            sidebarMenu.innerHTML = `<div class="menu-category">Subjects & Vaults</div>`;

            for (const [key, subject] of Object.entries(vaultData)) {
                const totalNotes = subject.notes.length;
                const isActive = key === currentSubjectKey ? "active" : "";
                
                sidebarMenu.innerHTML += `
                    <li class="menu-item ${isActive}" onclick="selectSubject('${key}')">
                        <div style="display: flex; align-items: center; gap: 0.75rem;">
                            <span style="font-size: 1.1rem;">${subject.icon}</span>
                            <span>${subject.name}</span>
                        </div>
                        <span class="badge">${totalNotes}</span>
                    </li>
                `;
            }
        }

        function selectSubject(subjectKey) {
            currentSubjectKey = subjectKey;
            currentSubtopic = "all";
            document.getElementById("searchInput").value = "";
            renderSidebar();
            loadSubject(subjectKey);
            renderNotesContent();
            
            if (window.innerWidth <= 900) {
                toggleMobileSidebar();
            }
        }

        function loadSubject(subjectKey) {
            const subject = vaultData[subjectKey];
            
            document.getElementById("activeSubjectTitle").innerHTML = `${subject.icon} ${subject.name}`;
            document.getElementById("breadcrumbNav").innerHTML = `<span>Home</span> &gt; <span class="current">${subject.name}</span>`;

            const subtopicTabs = document.getElementById("subtopicTabs");
            subtopicTabs.innerHTML = "";
            for (const [tKey, tName] of Object.entries(subject.topics)) {
                const activeClass = tKey === currentSubtopic ? "active" : "";
                subtopicTabs.innerHTML += `
                    <button class="subtopic-pill ${activeClass}" onclick="selectSubtopic('${tKey}')">${tName}</button>
                `;
            }
        }

        function selectSubtopic(subtopicKey) {
            currentSubtopic = subtopicKey;
            
            const pills = document.querySelectorAll(".subtopic-pill");
            pills.forEach(pill => {
                if (pill.innerText === vaultData[currentSubjectKey].topics[subtopicKey]) {
                    pill.classList.add("active");
                } else {
                    pill.classList.remove("active");
                }
            });

            renderNotesContent();
        }

        function switchView(viewType) {
            currentView = viewType;
            document.getElementById("gridBtn").classList.toggle("active", viewType === "grid");
            document.getElementById("listBtn").classList.toggle("active", viewType === "list");
            renderNotesContent();
        }

        function filterNotes() {
            renderNotesContent();
        }

        function renderNotesContent() {
            const subject = vaultData[currentSubjectKey];
            const searchQuery = document.getElementById("searchInput").value.toLowerCase();
            const container = document.getElementById("contentDisplayArea");

            let filteredNotes = subject.notes.filter(note => {
                const matchesSubtopic = currentSubtopic === "all" || note.topic === currentSubtopic;
                const matchesSearch = note.title.toLowerCase().includes(searchQuery) || note.description.toLowerCase().includes(searchQuery);
                return matchesSubtopic && matchesSearch;
            });

            if (filteredNotes.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <h3>No notes found</h3>
                        <p>Try searching for something else or switch sub-topics.</p>
                    </div>
                `;
                return;
            }

            if (currentView === "grid") {
                let gridHtml = `<div class="notes-grid">`;
                filteredNotes.forEach(note => {
                    const formatClass = note.format.toLowerCase() === 'pdf' ? 'pdf' : 'docs';
                    gridHtml += `
                        <div class="note-card">
                            <div class="card-thumbnail">
                                <span class="format-badge ${formatClass}">${note.format}</span>
                                <img src="${note.thumbnail}" alt="${note.title}" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                                <div class="fallback-icon" style="display:none;">${subject.icon}</div>
                            </div>
                            <div class="card-body">
                                <h3 class="card-title">${note.title}</h3>
                                <p class="card-desc">${note.description}</p>
                                <div class="card-footer">
                                    <span class="card-date">${note.date}</span>
                                    <a href="${note.fileUrl}" target="_blank" class="btn-action">
                                        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                        View Note
                                    </a>
                                </div>
                            </div>
                        </div>
                    `;
                });
                gridHtml += `</div>`;
                container.innerHTML = gridHtml;
            } else {
                let listHtml = `
                    <div class="notes-list-container">
                        <table class="notes-table">
                            <thead>
                                <tr>
                                    <th>Document Title & Description</th>
                                    <th>Format</th>
                                    <th>Date Added</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                filteredNotes.forEach(note => {
                    const formatClass = note.format.toLowerCase() === 'pdf' ? 'pdf' : 'docs';
                    listHtml += `
                        <tr>
                            <td>
                                <div class="list-title-cell">${subject.icon} ${note.title}</div>
                                <div class="list-desc-cell">${note.description}</div>
                            </td>
                            <td><span class="format-badge ${formatClass}" style="position:static; display:inline-block;">${note.format}</span></td>
                            <td style="color: var(--text-muted); font-size: 0.85rem;">${note.date}</td>
                            <td>
                                <a href="${note.fileUrl}" target="_blank" class="btn-action">
                                    <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                                    View
                                </a>
                            </td>
                        </tr>
                    `;
                });
                listHtml += `
                            </tbody>
                        </table>
                    </div>
                `;
                container.innerHTML = listHtml;
            }
        }

        window.onload = initApp;
    </script>
</body>
</html>
